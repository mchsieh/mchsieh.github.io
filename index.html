<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ming-Che Hsieh</title>
  <meta name="description" content="Ming-Che Hsieh 的個人專頁 — National Central University">
  <style>
    :root {
      --bg: #fafaf7;
      --fg: #1f2328;
      --muted: #6b7280;
      --accent: #1d4e89;
      --line: #e5e7eb;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419;
        --fg: #e6edf3;
        --muted: #9aa4af;
        --accent: #7fb3ff;
        --line: #2a313a;
        --card: #161c23;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.7;
    }
    main { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
    header { border-bottom: 1px solid var(--line); padding-bottom: 28px; margin-bottom: 36px; }
    h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: 0.01em; }
    .sub { color: var(--muted); margin: 0; }
    .links { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; }
    .links a { color: var(--accent); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    h2 { font-size: 1.15rem; margin: 36px 0 12px; color: var(--accent); }
    section p { margin: 0 0 12px; }
    ul { padding-left: 1.2em; margin: 0; }
    li { margin-bottom: 8px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
    footer { margin-top: 56px; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--line); padding-top: 20px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Ming-Che Hsieh</h1>
    <p class="sub">National Central University</p>
    <div class="links">
      <a href="https://github.com/mchsieh">GitHub</a>
      <a href="mailto:duom1104@gmail.com">Email</a>
    </div>
  </header>

  <section>
    <h2>關於我</h2>
    <p>這裡可以放一段簡短的自我介紹：目前的身份、研究興趣與背景。</p>
  </section>

  <section>
    <h2>研究興趣</h2>
    <div class="card">
      <ul>
        <li>研究主題一</li>
        <li>研究主題二</li>
        <li>研究主題三</li>
      </ul>
    </div>
  </section>

  <section>
    <h2>學歷</h2>
    <ul>
      <li>學校 / 系所 / 學位 / 年份</li>
    </ul>
  </section>

  <section>
    <h2>經歷與作品</h2>
    <ul>
      <li>計畫、論文、報告或專案名稱，附上連結</li>
    </ul>
  </section>

  <footer>© 2026 Ming-Che Hsieh · 以 GitHub Pages 架設</footer>
</main>
</body>
</html>
